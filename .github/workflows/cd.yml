name: "CD"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "cd-${{ github.ref }}"
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: "config.settings"
  PYTHONPATH: "${{ github.workspace }}/src"
  DJANGO_SECRET_KEY: "cd-secret-key"
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
  DJANGO_LANGUAGE_CODE: "en-us"
  DJANGO_TIME_ZONE: "UTC"

jobs:
  verify:
    name: "Verify (pre-commit + tests)"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Cache pre-commit"
        uses: "actions/cache@v4"
        with:
          path: "~/.cache/pre-commit"
          key: "pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}"

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: "Run pre-commit"
        run: |
          python -m pre_commit run --all-files

      - name: "Run checks + tests"
        run: |
          python src/manage.py check
          python src/manage.py makemigrations --check --dry-run
          python -m pytest

  docker:
    name: "Docker build + smoke check (no push)"
    runs-on: "ubuntu-latest"
    needs: ["verify"]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Compute safe ref name"
        id: "ref"
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          SAFE_REF="${REF//\//-}"
          echo "safe=${SAFE_REF}" >> "$GITHUB_OUTPUT"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v3"

      - name: "Build image (cached, load locally)"
        uses: "docker/build-push-action@v6"
        with:
          context: "."
          load: true
          tags: "notes-rest-api:${{ steps.ref.outputs.safe }}"
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"

      - name: "Run container + HTTP smoke check"
        run: |
          set -euo pipefail

          TAG="${{ steps.ref.outputs.safe }}"

          docker run -d --rm \
            --name nra_smoke \
            -p 8000:8000 \
            -e DJANGO_SECRET_KEY="${DJANGO_SECRET_KEY}" \
            -e DJANGO_DEBUG="${DJANGO_DEBUG}" \
            -e DJANGO_ALLOWED_HOSTS="localhost,127.0.0.1,0.0.0.0" \
            "notes-rest-api:${TAG}" \
            sh -lc "python /app/src/manage.py migrate --noinput && python /app/src/manage.py runserver 0.0.0.0:8000"

          cleanup() {
            docker logs nra_smoke || true
            docker stop nra_smoke || true
          }
          trap cleanup EXIT

          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8000/api/schema/" > /dev/null; then
              echo "OK: /api/schema/ is reachable"
              exit 0
            fi
            sleep 0.5
          done

          echo "FAIL: app did not become ready in time"
          exit 1

      - name: "Export docker image to dist/"
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.safe }}"
          mkdir -p dist
          docker save "notes-rest-api:${TAG}" | gzip > "dist/notes-rest-api-${TAG}-image.tar.gz"

      - name: "Upload artifacts (docker image)"
        uses: "actions/upload-artifact@v4"
        with:
          name: "cd-dist-${{ steps.ref.outputs.safe }}"
          path: "dist/*"
          if-no-files-found: "error"

  release:
    name: "GitHub Release (source + docker image)"
    runs-on: "ubuntu-latest"
    needs: ["docker"]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: "write"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: "Compute safe ref name"
        id: "ref"
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          SAFE_REF="${REF//\//-}"
          echo "safe=${SAFE_REF}" >> "$GITHUB_OUTPUT"

      - name: "Download docker artifact"
        uses: "actions/download-artifact@v4"
        with:
          name: "cd-dist-${{ steps.ref.outputs.safe }}"
          path: "dist"

      - name: "Build source archive + checksums"
        id: "pkg"
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          NAME="notes-rest-api-${TAG}"

          mkdir -p dist
          git archive --format=zip --output "dist/${NAME}.zip" "HEAD"

          python - <<'PY'
          import hashlib
          from pathlib import Path

          p = Path("dist")
          lines = []
          for f in sorted(p.glob("*")):
              if f.is_file():
                  h = hashlib.sha256(f.read_bytes()).hexdigest()
                  lines.append(f"{h}  {f.name}")
          (p / "checksums.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: "Create GitHub Release"
        uses: "softprops/action-gh-release@v2"
        with:
          name: "${{ steps.pkg.outputs.name }}"
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
