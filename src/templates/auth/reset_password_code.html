{% extends "base_auth.html" %}
{% block title %}ENTER RESET CODE{% endblock %}

{% block content %}
    <div class="auth-page">
        <div class="auth-card card">
            <div class="auth-header">
                <h1 class="auth-title">Enter reset code</h1>
                <p class="auth-subtitle">
                    Paste the code from email and set a new password
                </p>
            </div>

            <form
                class="auth-form"
                id="reset-password-code-form"
                novalidate
            >
                <div
                    class="auth-errors"
                    id="reset-code-errors"
                    style="display:none;"
                ></div>

                <label class="auth-label">
                    <span class="auth-label-text">Reset code</span>
                    <input
                        class="auth-input"
                        name="code"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="123456"
                        required
                    />
                </label>

                <label class="auth-label">
                    <span class="auth-label-text">New password</span>
                    <input
                        class="auth-input"
                        type="password"
                        name="new_password"
                        autocomplete="new-password"
                        required
                    />
                </label>

                <button type="submit" class="auth-submit-btn">
                    Change password
                </button>
            </form>

            <div class="auth-links">
                <div class="auth-link-row">
                    <span>Need a new code?</span>
                    <a href="/reset-password/">Send again</a>
                </div>
                <div class="auth-link-row">
                    <span>Back to</span>
                    <a href="/login/">Log in</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
