{% extends "base_auth.html" %}
{% block title %}RESET PASSWORD{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <h1 class="auth-title">Reset password</h1>
      <p class="auth-subtitle">Enter your email to receive a reset code</p>
    </div>

    <form class="auth-form" id="reset-password-request-form" novalidate>
      <div class="auth-errors" id="reset-request-errors" style="display:none;"></div>

      <label class="auth-label">
        <span class="auth-label-text">Email</span>
        <input class="auth-input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required />
      </label>

      <button type="submit" class="auth-submit-btn">Send code</button>
    </form>

    <div class="auth-links">
      <div class="auth-link-row">
        <span>Remembered?</span>
        <a href="/login/">Log in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
